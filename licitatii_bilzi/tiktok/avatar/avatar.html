<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { width: 1080px; height: 1020px; position: relative; font-family: 'Nunito', sans-serif; }
  #wrap { position: absolute; width: 400px; height: 700px; transform-origin: 50% 100%; }
  #wrap svg { width: 100%; height: 100%; overflow: visible; }
  #bubble {
    position: absolute; max-width: 820px; box-sizing: border-box;
    background: #fff; color: #0F3B38; border: 7px solid #127F7E; border-radius: 38px;
    padding: 20px 32px 22px; font-weight: 900; font-size: 47px; line-height: 1.12;
    box-shadow: 0 10px 0 rgba(15, 83, 79, .35);
    transform-origin: 18% 100%;
  }
  #bubble::after {   /* codița balonului, spre capul personajului */
    content: ""; position: absolute; left: 120px; bottom: -40px;
    border-left: 22px solid transparent; border-right: 30px solid transparent;
    border-top: 40px solid #127F7E;
  }
  #bubble::before {
    content: ""; position: absolute; left: 129px; bottom: -26px; z-index: 2;
    border-left: 14px solid transparent; border-right: 20px solid transparent;
    border-top: 28px solid #fff;
  }
  #bubble b { color: #E5731A; }
</style></head>
<body>
<div id="bubble"></div>
<div id="wrap">
<svg viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="vestclip">
      <path d="M92,700 L92,560 C92,445 122,398 166,386 L182,700 Z"/>
      <path d="M308,700 L308,560 C308,445 278,398 234,386 L218,700 Z"/>
    </clipPath>
  </defs>

  <!-- brațul care face cu mâna / degetul mare (în spatele trunchiului) -->
  <g id="arm" transform="translate(300,410) rotate(160)">
    <rect x="-27" y="-150" width="54" height="160" rx="26" fill="#0F534F"/>
    <g id="palm">
      <rect x="-30" y="-214" width="13" height="40" rx="6.5" fill="#F4C7A1"/>
      <rect x="-15" y="-224" width="13" height="50" rx="6.5" fill="#F4C7A1"/>
      <rect x="1" y="-222" width="13" height="48" rx="6.5" fill="#F4C7A1"/>
      <rect x="17" y="-212" width="13" height="40" rx="6.5" fill="#F4C7A1"/>
      <ellipse cx="0" cy="-168" rx="34" ry="30" fill="#F4C7A1"/>
      <rect x="22" y="-182" width="30" height="13" rx="6.5" fill="#F4C7A1" transform="rotate(-30 22 -176)"/>
    </g>
    <g id="thumb" style="display:none">
      <rect x="-30" y="-196" width="60" height="50" rx="22" fill="#F4C7A1"/>
      <path d="M-30,-180 h60 M-30,-166 h60" stroke="#E2A57E" stroke-width="3"/>
      <rect x="-14" y="-240" width="22" height="54" rx="11" fill="#F4C7A1"/>
    </g>
  </g>

  <!-- ciocanul sprijinit pe umăr -->
  <g id="hammer">
    <line x1="128" y1="470" x2="62" y2="318" stroke="#9A5B25" stroke-width="17" stroke-linecap="round"/>
    <g transform="translate(62,318) rotate(-23)">
      <rect x="-44" y="-17" width="88" height="34" rx="6" fill="#6E7B85"/>
      <rect x="-44" y="-17" width="88" height="10" rx="5" fill="#8C99A3"/>
      <rect x="34" y="-21" width="16" height="42" rx="4" fill="#59656E"/>
    </g>
  </g>

  <!-- trunchi: cămașă + vestă reflectorizantă -->
  <path d="M58,700 L58,560 C58,425 110,372 200,372 C290,372 342,425 342,560 L342,700 Z" fill="#0F534F"/>
  <path d="M92,700 L92,560 C92,445 122,398 166,386 L182,700 Z" fill="#F57F17"/>
  <path d="M308,700 L308,560 C308,445 278,398 234,386 L218,700 Z" fill="#F57F17"/>
  <rect x="190" y="430" width="20" height="270" fill="#0B4440" opacity=".35"/>
  <g clip-path="url(#vestclip)">
    <rect x="80" y="468" width="240" height="15" fill="#E3ECEB"/>
    <rect x="80" y="512" width="240" height="15" fill="#E3ECEB"/>
  </g>
  <path d="M170,378 L200,420 L230,378 Z" fill="#E8B48C"/>
  <rect x="236" y="420" width="62" height="26" rx="8" fill="#fff"/>
  <text x="267" y="439" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="16" fill="#0F534F">BILZI</text>
  <!-- mâna care ține ciocanul -->
  <ellipse cx="128" cy="470" rx="26" ry="23" fill="#F4C7A1"/>
  <path d="M110,462 h34 M108,474 h36" stroke="#E2A57E" stroke-width="3" stroke-linecap="round"/>

  <!-- gât -->
  <rect x="174" y="322" width="52" height="62" rx="12" fill="#E8B48C"/>

  <!-- capul -->
  <g id="head" transform="rotate(0 200 330)">
    <ellipse cx="108" cy="238" rx="18" ry="25" fill="#EDB58F"/>
    <ellipse cx="292" cy="238" rx="18" ry="25" fill="#EDB58F"/>
    <ellipse cx="200" cy="238" rx="92" ry="100" fill="#F4C7A1"/>
    <path d="M110,200 C108,230 112,255 120,268 L130,262 C124,240 124,218 126,200 Z" fill="#7A6352"/>
    <path d="M290,200 C292,230 288,255 280,268 L270,262 C276,240 276,218 274,200 Z" fill="#7A6352"/>
    <circle cx="140" cy="282" r="17" fill="#F2998C" opacity=".45"/>
    <circle cx="260" cy="282" r="17" fill="#F2998C" opacity=".45"/>

    <g id="brows">
      <path d="M136,212 Q159,198 182,207" stroke="#5A4030" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M218,207 Q241,198 264,212" stroke="#5A4030" stroke-width="10" fill="none" stroke-linecap="round"/>
    </g>
    <g id="eyes">
      <ellipse cx="160" cy="236" rx="16" ry="18" fill="#fff"/>
      <ellipse cx="240" cy="236" rx="16" ry="18" fill="#fff"/>
      <circle cx="163" cy="239" r="9.5" fill="#2A2A2A"/>
      <circle cx="243" cy="239" r="9.5" fill="#2A2A2A"/>
      <circle cx="166" cy="235" r="3.2" fill="#fff"/>
      <circle cx="246" cy="235" r="3.2" fill="#fff"/>
    </g>
    <ellipse cx="200" cy="262" rx="21" ry="18" fill="#E9A07A"/>
    <ellipse cx="193" cy="256" rx="6" ry="4" fill="#F6C3A4" opacity=".8"/>

    <g id="mouthg">
      <ellipse id="mouth" cx="200" cy="300" rx="27" ry="6" fill="#6E1F1F"/>
      <ellipse id="tongue" cx="200" cy="310" rx="14" ry="0" fill="#E06363"/>
    </g>
    <path d="M200,274 C186,262 150,262 131,284 C126,295 139,304 153,299 C169,294 186,289 200,288 C214,289 231,294 247,299 C261,304 274,295 269,284 C250,262 214,262 200,274 Z" fill="#4A3426"/>

    <!-- casca, în culorile siglei -->
    <path d="M100,194 C100,112 150,70 200,70 C250,70 300,112 300,194 Z" fill="#127F7E"/>
    <path d="M186,72 C194,70 206,70 214,72 L218,194 L182,194 Z" fill="#E5731A"/>
    <ellipse cx="150" cy="118" rx="30" ry="13" fill="#fff" opacity=".22" transform="rotate(-28 150 118)"/>
    <path d="M74,188 Q200,168 326,188 L328,208 Q200,190 72,208 Z" fill="#0F534F"/>
  </g>
</svg>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const easeBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  // starea unui cadru: {t, ax, ay, sc, mouth, blink, gesture, talk, bubble:{html, show, x, y}}
  window.renderFrame = (s) => {
    const w = $('wrap');
    const bob = Math.sin(s.t * 2 * Math.PI * 0.9) * 5 + (s.talk ? Math.sin(s.t * 13) * 2 : 0);
    w.style.left = (s.ax - 200) + 'px';
    w.style.top = (s.ay - 700) + 'px';
    w.style.transform = `translateY(${bob}px) scale(${s.sc}) rotate(${s.talk ? Math.sin(s.t * 5) * 1.2 : 0}deg)`;
    $('head').setAttribute('transform', `rotate(${(s.talk ? Math.sin(s.t * 7) * 3 : Math.sin(s.t * 1.3) * 1.5)} 200 330)`);
    $('eyes').setAttribute('transform', `translate(0 ${236 * (1 - s.blink)}) scale(1 ${s.blink})`);
    $('brows').setAttribute('transform', `translate(0 ${s.talk ? -Math.max(0, Math.sin(s.t * 4)) * 6 : 0})`);
    const m = Math.max(0, Math.min(1, s.mouth));
    $('mouth').setAttribute('ry', 5 + m * 20);
    $('mouth').setAttribute('cy', 298 + m * 9);
    $('tongue').setAttribute('ry', m * 7);
    $('tongue').setAttribute('cy', 306 + m * 14);
    // gesturi: idle (braț jos), wave (face cu mâna), thumb (degetul mare sus)
    let ang = 160;
    if (s.gesture === 'wave') ang = 30 + Math.sin(s.t * 2 * Math.PI * 1.6) * 16;
    if (s.gesture === 'thumb') ang = 24 + Math.sin(s.t * 3) * 3;
    ang = s.armBlend * ang + (1 - s.armBlend) * 160;
    $('arm').setAttribute('transform', `translate(300,410) rotate(${ang})`);
    $('arm').style.display = s.armBlend < 0.03 ? 'none' : '';
    $('palm').style.display = s.gesture === 'thumb' ? 'none' : '';
    $('thumb').style.display = s.gesture === 'thumb' ? '' : 'none';

    const b = $('bubble');
    if (s.bubble && s.bubble.show > 0) {
      if (b.dataset.html !== s.bubble.html) { b.innerHTML = s.bubble.html; b.dataset.html = s.bubble.html; }
      const k = s.bubble.show;
      b.style.display = 'block';
      b.style.left = s.bubble.x + 'px';
      b.style.top = (s.bubble.y - b.offsetHeight) + 'px';
      b.style.opacity = Math.min(1, k * 1.6);
      b.style.transform = `scale(${0.55 + 0.45 * easeBack(Math.min(1, k))})`;
    } else {
      b.style.display = 'none';
    }
  };
</script>
</body></html>
